<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A股调研助手</title>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">CODEX RESEARCH</p>
          <h1>A股调研助手</h1>
          <p class="subtitle">单股深度调研与自定义盯盘脑图。</p>
        </div>

        <nav class="feature-nav" aria-label="功能">
          <button class="feature-button active" data-feature="research" type="button">单股调研</button>
          <button class="feature-button" data-feature="watch" type="button">盯盘脑图</button>
        </nav>

        <div id="research-sidebar-content" class="research-sidebar-content">
          <section class="research-form">
            <label for="stock-name">A股标的名称</label>
            <input id="stock-name" autocomplete="off" placeholder="例如：贵州茅台" />
            <button id="primary-action" class="primary" type="button">调研</button>
            <p id="task-status" class="status-line">等待开始调研</p>
          </section>

          <section class="environment-card">
            <div class="section-heading">
              <h2>Codex 环境</h2>
              <button id="redetect-codex" class="link-button" type="button">重新检测</button>
            </div>
            <p id="codex-status" class="muted">正在检测 Codex CLI...</p>
          </section>

          <section class="history-section">
            <div class="section-heading">
              <h2>历史记录</h2>
              <button id="refresh-history" class="link-button" type="button">刷新</button>
            </div>
            <div id="history-list" class="history-list"></div>
          </section>
        </div>
      </aside>

      <section id="research-workspace" class="workspace">
        <header class="toolbar">
          <div>
            <span class="toolbar-label">PDF 报告目录</span>
            <strong id="report-directory">尚未配置</strong>
          </div>
          <div class="toolbar-actions">
            <button id="configure-directory" type="button">配置目录</button>
            <button id="open-pdf" type="button" hidden>打开 PDF</button>
            <button id="retry-pdf" type="button" hidden>重新导出 PDF</button>
          </div>
        </header>

        <nav class="tabs" aria-label="报告视图">
          <button class="tab active" data-tab="report" type="button">调研报告</button>
          <button class="tab" data-tab="output" type="button">实时输出</button>
          <button class="tab" data-tab="spec" type="button">调研规范</button>
        </nav>

        <section id="report-panel" class="panel report-panel">
          <div class="empty-state">
            <h2>尚无调研报告</h2>
            <p>输入标的名称并点击“调研”，完成后报告会显示在这里。</p>
          </div>
        </section>
        <section id="output-panel" class="panel output-panel" hidden>
          <div id="working-indicator" class="working-indicator" hidden>
            <span class="working-spinner" aria-hidden="true"></span>
            <span>working</span>
            <span id="working-elapsed" class="working-elapsed">00:00</span>
          </div>
          <div id="live-output-scroll" class="live-output-scroll">
            <pre id="live-output">等待调研任务启动...</pre>
          </div>
        </section>
        <section id="spec-panel" class="panel spec-panel" hidden>
          <div class="spec-heading">
            <div>
              <h2>调研规范</h2>
              <p>修改后保存。新规范会从下一次调研开始生效。</p>
            </div>
            <div class="spec-actions">
              <button id="reset-spec" type="button">恢复初始版本</button>
              <button id="save-spec" type="button">保存规范</button>
            </div>
          </div>
          <textarea id="research-spec" spellcheck="false" aria-label="调研规范"></textarea>
          <p id="spec-status" class="spec-status"></p>
        </section>
      </section>

      <section id="watch-workspace" class="workspace watch-workspace" hidden>
        <header class="toolbar">
          <div class="watch-toolbar-status">
            <span class="toolbar-label">盯盘脑图</span>
            <div class="watch-workspace-tabs-row">
              <div id="watch-workspace-tabs" class="watch-workspace-tabs" role="tablist" aria-label="盯盘脑图展示区"></div>
              <button id="add-watch-workspace" class="watch-workspace-add" type="button" title="新增展示区">+</button>
            </div>
            <div class="watch-date-row">
              <label class="watch-date-label" for="watch-trading-date">数据日期</label>
              <select id="watch-trading-date" aria-label="数据日期"></select>
              <strong id="watch-market-error" class="watch-market-error"></strong>
            </div>
            <strong id="watch-status">打开后自动刷新行情</strong>
          </div>
          <div class="toolbar-actions">
            <button id="refresh-watch-quotes" type="button">刷新行情</button>
            <button id="export-watch-data" type="button">导出数据</button>
            <button id="import-watch-data" type="button">导入数据</button>
          </div>
        </header>

        <section id="watch-panel" class="watch-panel">
          <div id="watch-tree" class="watch-tree"></div>
        </section>
        <div id="watch-context-menu" class="watch-context-menu" hidden></div>
      </section>
    </main>

    <dialog id="watch-node-dialog" class="watch-node-dialog">
      <form id="watch-node-form">
        <h2 id="watch-node-dialog-title">配置节点</h2>
        <label for="watch-node-type">节点类型</label>
        <select id="watch-node-type">
          <option value="category">分类</option>
          <option value="stock">股票</option>
        </select>
        <label for="watch-node-name">名称</label>
        <input id="watch-node-name" autocomplete="off" />
        <button id="search-watch-stock" type="button">按名称搜索股票</button>
        <div id="watch-stock-results" class="watch-stock-results" hidden></div>
        <label id="watch-node-secid-label" for="watch-node-secid">已选股票 secid</label>
        <input id="watch-node-secid" readonly placeholder="请先搜索并选择股票" />
        <label id="watch-node-industry-position-label" for="watch-node-industry-position">行业地位</label>
        <select id="watch-node-industry-position">
          <option value="">无</option>
          <option value="leader1">龙头一</option>
          <option value="leader2">龙头二</option>
          <option value="leader3">龙头三</option>
        </select>
        <label id="watch-node-holding-label" for="watch-node-holding">持仓股</label>
        <select id="watch-node-holding">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
        <p id="watch-node-error" class="dialog-error"></p>
        <div class="dialog-actions">
          <button id="cancel-watch-node" type="button">取消</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="market-provider-dialog" class="settings-dialog">
      <form id="market-provider-form">
        <h2>数据源设置</h2>
        <p class="settings-hint">选择盯盘脑图使用的行情数据源。模拟数据会从最近真实交易日第一个分时点开始回放。</p>
        <label for="market-provider-select">数据源</label>
        <select id="market-provider-select">
          <option value="east-money">东方财富</option>
          <option value="mock-cache">模拟数据</option>
        </select>
        <p id="market-provider-status" class="dialog-error"></p>
        <div class="dialog-actions">
          <button id="cancel-market-provider" type="button">取消</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
